<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces and borders" subtitle="Warm page, white cards, cream callouts, thin dividers" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:16px;background:var(--surface-page)"><div style="display:flex;gap:12px">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-thin);border-radius:var(--radius-md);box-shadow:var(--shadow-card);padding:14px"><div style="font-size:13px;font-weight:500">Card</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:4px">--surface-card</div></div>
<div style="flex:1;background:var(--surface-callout);border:1px solid var(--border-thin);border-radius:var(--radius-md);padding:14px"><div style="font-size:13px;font-weight:500">Callout</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:4px">--surface-callout</div></div>
<div style="flex:1;background:var(--surface-hover);border-radius:var(--radius-md);padding:14px"><div style="font-size:13px;font-weight:500">Hover</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:4px">--surface-hover</div></div>
<div style="flex:1;background:var(--surface-sidebar);border-radius:var(--radius-md);padding:14px;color:var(--text-inverse)"><div style="font-size:13px;font-weight:500">Sidebar</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-inverse-muted);margin-top:4px">--surface-sidebar</div></div>
</div></body></html>
