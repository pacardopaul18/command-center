<!-- @dsCard group="Type" viewport="700x210" name="Type scale" subtitle="11 to 30px" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:16px">

<tr><td style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);padding:4px 12px 4px 0">--text-xl 24px</td><td style="font-size:24px;font-weight:700;line-height:1.2">Today</td></tr>
