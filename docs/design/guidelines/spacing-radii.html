<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="8 controls, 12 cards, 16 large, pill chips" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px 16px"><div style="display:flex;gap:16px;align-items:flex-start">
<div style="text-align:center"><div style="width:110px;height:64px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface-card)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:8px">sm 8px inputs</div></div>
<div style="text-align:center"><div style="width:110px;height:64px;border:1px solid var(--border-thin);border-radius:12px;background:var(--surface-card);box-shadow:var(--shadow-card)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:8px">md 12px cards</div></div>
<div style="text-align:center"><div style="width:110px;height:64px;border:1px solid var(--border-thin);border-radius:16px;background:var(--surface-callout)"></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:8px">lg 16px modals</div></div>
<div style="text-align:center"><div style="width:110px;height:64px;display:flex;align-items:center;justify-content:center"><span style="background:var(--chip-ontrack-bg);color:var(--chip-ontrack-fg);font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px">on track</span></div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:8px">pill chips</div></div>
</div></body></html>
