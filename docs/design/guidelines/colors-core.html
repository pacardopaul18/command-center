<!-- @dsCard group="Colors" viewport="700x150" name="Core palette" subtitle="Navy primary, gold accent, cream, ink, muted, green" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>.sw{flex:1;border-radius:var(--radius-sm);padding:10px;display:flex;flex-direction:column;justify-content:flex-end;height:96px;box-sizing:border-box}.nm{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em}</style></head>
<body style="padding:16px"><div style="display:flex;gap:8px">
<div class="sw" style="background:var(--navy);color:#fff"><span class="nm">navy</span><span class="nm" style="opacity:.7">#102A4C</span></div>
<div class="sw" style="background:var(--gold);color:#3D3212"><span class="nm">gold</span><span class="nm" style="opacity:.7">#C9A84C</span></div>
<div class="sw" style="background:var(--cream);color:var(--muted);border:1px solid var(--border-thin)"><span class="nm">cream</span><span class="nm" style="opacity:.8">#FAF6EC</span></div>
<div class="sw" style="background:var(--ink);color:#fff"><span class="nm">ink</span><span class="nm" style="opacity:.7">#1B2433</span></div>
<div class="sw" style="background:var(--muted);color:#fff"><span class="nm">muted</span><span class="nm" style="opacity:.7">#5B6470</span></div>
<div class="sw" style="background:var(--green);color:#fff"><span class="nm">green</span><span class="nm" style="opacity:.7">#2E7D5B</span></div>
</div></body></html>
