<!-- @dsCard group="Spacing" viewport="700x160" name="Shadows and dividers" subtitle="Soft card shadow, popover shadow, 1px dividers" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:24px 16px;background:var(--surface-page)"><div style="display:flex;gap:24px;align-items:flex-start">
<div style="width:160px;background:var(--surface-card);border:1px solid var(--border-thin);border-radius:12px;box-shadow:var(--shadow-card);padding:14px"><div style="font-size:13px;font-weight:500">Card</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)">--shadow-card</div></div>
<div style="width:160px;background:var(--surface-card);border:1px solid var(--border-thin);border-radius:16px;box-shadow:var(--shadow-pop);padding:14px"><div style="font-size:13px;font-weight:500">Popover</div><div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)">--shadow-pop</div></div>
<div style="flex:1">
<div style="padding:8px 0;border-bottom:1px solid var(--border-thin);font-size:13px">Row one</div>
<div style="padding:8px 0;border-bottom:1px solid var(--border-thin);font-size:13px">Row two</div>
<div style="padding:8px 0;font-size:13px">Row three</div>
<div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:6px">--border-thin, horizontal only</div>
</div>
</div></body></html>
