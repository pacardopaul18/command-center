<!-- @dsCard group="Colors" viewport="700x130" name="Status colors" subtitle="Gold carries risk, green carries positive, the rest stay quiet" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>.chip{display:inline-flex;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}</style></head>
<body style="padding:20px 16px"><div style="display:flex;gap:8px;flex-wrap:wrap">
<span class="chip" style="background:var(--chip-ontrack-bg);color:var(--chip-ontrack-fg)">on track</span>
<span class="chip" style="background:var(--chip-atrisk-bg);color:var(--chip-atrisk-fg)">at risk</span>
<span class="chip" style="background:var(--chip-blocked-bg);color:var(--chip-blocked-fg)">blocked</span>
<span class="chip" style="background:var(--chip-done-bg);color:var(--chip-done-fg)">done</span>
<span class="chip" style="background:var(--chip-overdue-bg);color:var(--chip-overdue-fg)">overdue</span>
<span class="chip" style="background:var(--chip-waiting-bg);color:var(--chip-waiting-fg)">waiting</span>
<span class="chip" style="background:var(--chip-open-bg);color:var(--chip-open-fg)">open</span>
</div>
<p style="margin:16px 0 0;font-size:12.5px;color:var(--text-secondary)">One accent carries status. Gold is reserved for at risk and overdue, green for on track and done.</p>
</body></html>
