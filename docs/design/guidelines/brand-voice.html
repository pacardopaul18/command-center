<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px 16px"><div style="display:flex;gap:20px">
<div style="flex:1;background:var(--surface-callout);border:1px solid var(--border-thin);border-radius:12px;padding:14px">
<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--green)">Yes</div>
<p style="margin:8px 0 0;font-size:13px">No action items yet. Add one with quick add, or press N.</p>
<p style="margin:6px 0 0;font-size:13px">Three items are due today. One invoice is past 60 days.</p>
<p style="margin:6px 0 0;font-size:13px">Create action item</p>
</div>
<div style="flex:1;border:1px solid var(--border-thin);border-radius:12px;padding:14px">
<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-secondary)">No</div>
<p style="margin:8px 0 0;font-size:13px;color:var(--text-secondary)">🚀 You're all caught up!!</p>
<p style="margin:6px 0 0;font-size:13px;color:var(--text-secondary)">Heads up — this invoice is aging</p>
<p style="margin:6px 0 0;font-size:13px;color:var(--text-secondary)">Create Action Item</p>
</div>
</div></body></html>
