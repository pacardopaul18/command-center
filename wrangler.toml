# Cloudflare Workers config for Command Center.
#
# TARGET: Workers with Static Assets, not Pages. The project was created through
# the Workers Builds flow, so it is a Worker service, not a Pages project. See
# D29 in docs/DECISIONS.md.
#
# @sveltejs/adapter-cloudflare picks its target from this file. It builds for
# Pages when `pages_build_output_dir` is set (or CF_PAGES is in the env), and
# for Workers when `main` or `assets` is set. Both must never be set at once.
#
# Account: pacardopaul18@gmail.com (09d30ac2fb14b703740140910d92b108)
#
# Local dev does not use the deploy settings. Vite dev and preview emulate the
# bindings below with miniflare and persist state under .wrangler/state.
#
# Never put secrets here. ASANA_TOKEN, RESEND_API_KEY and any AI key go through
# `wrangler secret put NAME` or the Worker's settings in the dashboard.

name = "command-center"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# --- Public surface ---
# The app is reachable only at work.kabuhayan.app, which sits behind Cloudflare
# Access with One-Time PIN. Both workers.dev routes are switched off rather than
# gated by policy, because a hostname that does not exist cannot be misconfigured
# later. Closes R6. See docs/DECISIONS.md.
#
#   workers_dev   <name>.<subdomain>.workers.dev              defaults to true
#   preview_urls  <version>-<name>.<subdomain>.workers.dev    per version
#
# Both are set explicitly. Leaving preview_urls to its default would mean
# trusting a default to stay put on the one setting that decides whether an
# unauthenticated copy of the app is on the public internet.
workers_dev = false
preview_urls = false

# --- Static assets ---
# The client bundle and any prerendered pages. A request that matches an asset
# is served without invoking the Worker; anything else, including every /api
# route, falls through to the Worker. The adapter writes a .assetsignore into
# this directory so _worker.js is never served as a public file.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# --- D1: relational data (Users, Projects, ActionItems, ...) ---
# Primary region is APAC, auto-selected at create time from where the request
# came from. Correct for a single user working from APAC.
[[d1_databases]]
binding = "DB"
database_name = "command-center-db"
database_id = "00922b27-9b84-4097-ba4e-568a8f06c6ee"
migrations_dir = "migrations"

# --- KV: sessions and settings ---
[[kv_namespaces]]
binding = "SESSIONS"
id = "9671c77ef65242ebb96b4e7d771cb530"

# --- R2: transcripts, generated PDFs, SOP exports ---
# TO BE FILLED at the v1 gate (T-v1-0). Commented out on purpose: R2 is not
# enabled on the account, so a deploy carrying this binding would fail. Nothing
# before v1 writes files. Enable R2 in the dashboard, run
# `npx wrangler r2 bucket create command-center-files`, then uncomment.
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "command-center-files"
