# Cloudflare Workers config for Command Center.
#
# TARGET: Workers with Static Assets, not Pages. The project was created through
# the Workers Builds flow, so it is a Worker service, not a Pages project. See
# D29 in docs/DECISIONS.md.
#
# @sveltejs/adapter-cloudflare picks its target from this file. It builds for
# Pages when `pages_build_output_dir` is set (or CF_PAGES is in the env), and
# for Workers when `main` or `assets` is set. Both must never be set at once.
#
# Account: pacardopaul18@gmail.com (09d30ac2fb14b703740140910d92b108)
#
# Local dev does not use the deploy settings. Vite dev and preview emulate the
# bindings below with miniflare and persist state under .wrangler/state.
#
# Never put secrets here. ASANA_TOKEN, RESEND_API_KEY and any AI key go through
# `wrangler secret put NAME` or the Worker's settings in the dashboard.

name = "command-center"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# --- Public surface ---
# The app is reachable only at work.kabuhayan.app, which sits behind Cloudflare
# Access with One-Time PIN. Both workers.dev routes are switched off rather than
# gated by policy, because a hostname that does not exist cannot be misconfigured
# later. Closes R6. See docs/DECISIONS.md.
#
#   workers_dev   <name>.<subdomain>.workers.dev              defaults to true
#   preview_urls  <version>-<name>.<subdomain>.workers.dev    per version
#
# Both are set explicitly. Leaving preview_urls to its default would mean
# trusting a default to stay put on the one setting that decides whether an
# unauthenticated copy of the app is on the public internet.
workers_dev = false
preview_urls = false

# --- Scheduled digests ---
# Cron Triggers are UTC only. Every job here names a Mountain hour, and the
# trigger fires at both UTC hours that could be it in either half of the year.
# The handler reads the Mountain hour and decides which firing is real.
#
#   03:00 MT, nightly D1 to R2 backup   09:00Z summer, 10:00Z winter
#   07:00 MT, start of day digest       13:00Z summer, 14:00Z winter
#   17:00 MT, end of day digest         23:00Z summer, 00:00Z winter
#
# Six firings, three of which do nothing.
#
# Cron Triggers do not retry. The idempotency marker is written only after Resend
# accepts the message, so a failed send leaves the day unmarked and stays
# retryable rather than being silently swallowed. See D40.
[triggers]
crons = ["0 0,9,10,13,14,23 * * *"]

# --- Observability ---
# Workers Logs. Off by default, which is how the first digest incident became
# unanswerable: the question "what happened in the 23:00Z invocation" had no
# source of truth, because nothing was ever recorded. A scheduled job that runs
# twice a day, cannot be retried by the platform, and produces no HTTP response
# is invisible without this.
#
# Included on the Workers Free plan: 200,000 events per day, retained 3 days.
# Checked against the Cloudflare docs rather than assumed. A single user sending
# two digests a day is not close to that ceiling, and head_sampling_rate stays at
# 1 because sampling a twice-daily job would mean losing whole firings.
[observability]
enabled = true
head_sampling_rate = 1

# --- Digest settings ---
# Not secrets. RESEND_API_KEY is a Worker secret and never appears here.
#
# DIGEST_FROM sends from kabuhayan.app, which is verified in Resend with DKIM
# and SPF. That is the R7 mitigation: a verified domain is the single biggest
# lever on whether a daily digest reaches the inbox rather than spam, and a
# digest that silently lands in spam is the failure this product exists to
# prevent. See D43 as amended.
[vars]
DIGEST_FROM = "digest@kabuhayan.app"
DIGEST_TO = "pacardopaul18@gmail.com"

# --- Static assets ---
# The client bundle and any prerendered pages. A request that matches an asset
# is served without invoking the Worker; anything else, including every /api
# route, falls through to the Worker. The adapter writes a .assetsignore into
# this directory so _worker.js is never served as a public file.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# --- D1: relational data (Users, Projects, ActionItems, ...) ---
# Primary region is APAC, auto-selected at create time from where the request
# came from. Correct for a single user working from APAC.
[[d1_databases]]
binding = "DB"
database_name = "command-center-db"
database_id = "00922b27-9b84-4097-ba4e-568a8f06c6ee"
migrations_dir = "migrations"

# --- KV: sessions and settings ---
[[kv_namespaces]]
binding = "SESSIONS"
id = "9671c77ef65242ebb96b4e7d771cb530"

# --- R2: transcripts, generated PDFs, SOP exports ---
# T-v1-0 done. R2 enabled on the account and the bucket created 2026-08-29.
# The binding name stays FILES, matching App.Platform and every reference in the
# code, rather than the name wrangler suggests on create.
[[r2_buckets]]
binding = "FILES"
bucket_name = "command-center-files"
